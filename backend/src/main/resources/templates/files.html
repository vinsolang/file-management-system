<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My files')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="card">
  <p class="msg error" th:if="${error}" th:text="${error}"></p>
  <p class="msg ok" th:if="${success}" th:text="${success}"></p>
  <p class="msg error" th:if="${param.tooLarge != null}">File is too large (max 50MB).</p>

  <div class="toolbar">
    <form th:action="@{/folders}" method="post" class="inline">
      <input type="hidden" name="folderId" th:value="${data.currentFolderId}">
      <input name="name" placeholder="New folder name" maxlength="255" required>
      <button type="submit">+ Create folder</button>
    </form>
    <form th:action="@{/files/upload(_csrf=${_csrf.token})}" method="post" enctype="multipart/form-data" class="inline">
      <input type="hidden" name="folderId" th:value="${data.currentFolderId}">
      <input type="file" name="file" required>
      <button type="submit">Upload</button>
    </form>
  </div>

  <nav class="crumbs">
    <a th:href="@{/files}">Home</a>
    <span th:each="b : ${data.breadcrumb}"> / <a th:href="@{/files(folderId=${b.id})}" th:text="${b.name}"></a></span>
  </nav>

  <table>
    <thead><tr><th>Name</th><th>Size</th><th>Date</th><th>Actions</th></tr></thead>
    <tbody>
      <tr th:each="f : ${data.folders}">
        <td>📁 <a th:href="@{/files(folderId=${f.id})}" th:text="${f.name}"></a></td>
        <td>—</td>
        <td th:text="${#strings.replace(#strings.substring(f.createdAt, 0, 16), 'T', ' ')}"></td>
        <td class="actions">
          <form th:action="@{/folders/{id}/delete(id=${f.id})}" method="post" class="inline"
                onsubmit="return confirm('Delete this folder and everything inside it?')">
            <input type="hidden" name="folderId" th:value="${data.currentFolderId}">
            <button class="danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
      <tr th:each="f : ${data.files}">
        <td>📄 <span th:text="${f.name}"></span></td>
        <td th:text="${#numbers.formatDecimal(f.size / 1024.0, 1, 1)} + ' KB'"></td>
        <td th:text="${#strings.replace(#strings.substring(f.uploadedAt, 0, 16), 'T', ' ')}"></td>
        <td class="actions">
          <a class="button" th:if="${f.previewType != null}" th:href="@{/files/{id}/view(id=${f.id})}">Preview</a>
          <a class="button" th:href="@{/api/files/{id}/download(id=${f.id})}">Download</a>
          <form th:action="@{/files/{id}/delete(id=${f.id})}" method="post" class="inline"
                onsubmit="return confirm('Delete this file?')">
            <input type="hidden" name="folderId" th:value="${data.currentFolderId}">
            <button class="danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="msg" th:if="${#lists.isEmpty(data.folders) and #lists.isEmpty(data.files)}">This folder is empty.</p>
</main>
</body>
</html>
