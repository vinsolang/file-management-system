<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<main class="card narrow">
  <h1>file-management-system</h1>
  <p class="msg ok" th:if="${param.registered != null}">Registration submitted. Please wait for administrator approval.</p>
  <p class="msg ok" th:if="${param.logout != null}">You have been logged out.</p>
  <p class="msg error" th:if="${param.error != null and param.error[0] == 'inactive'}">Your account is pending approval or was rejected. Please contact the administrator.</p>
  <p class="msg error" th:if="${param.error != null and param.error[0] == 'invalid'}">Invalid email or password.</p>
  <form th:action="@{/login}" method="post" class="block">
    <input name="email" type="email" placeholder="Email" required autofocus>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>
  <p>No account? <a th:href="@{/register}">Register</a></p>
</main>
</body>
</html>
