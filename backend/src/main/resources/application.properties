spring.application.name=file-management-system

spring.datasource.url=jdbc:sqlite:./data/filesystem.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Uploaded file contents (outside the public static directory)
app.upload-dir=./uploads

# Default administrator created on first start - CHANGE THE PASSWORD
app.admin.name=System Administrator
app.admin.email=admin@example.com
app.admin.password=Admin@12345

# Thymeleaf
spring.thymeleaf.cache=false
# Lets oversize-upload errors be handled inside the web controller
spring.servlet.multipart.resolve-lazily=true
